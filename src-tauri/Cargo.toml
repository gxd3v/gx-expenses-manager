[package]
name = "gx-expenses-manager"
version = "0.9.0"
description = "Personal expense manager"
authors = ["gxd3v"]
edition = "2024"
rust-version = "1.90"
default-run = "gx-expenses-manager"

[lib]
name = "gx_expenses_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "playground"
required-features = ["playground"]

[features]
playground = ["dep:axum", "dep:async-graphql-axum", "tokio/full"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-graphql = { version = "7", features = ["chrono", "uuid"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono", "uuid"] }
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
axum = { version = "0.8", optional = true }
async-graphql-axum = { version = "7", optional = true }
age = "0.12.1"
csv = "1.4.0"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[lints.rust]
linker_messages = "allow"
